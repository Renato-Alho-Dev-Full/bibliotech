<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace do Gerente - Bibliotech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.436.0/dist/umd/lucide.min.js"></script>
    <script src="config.js"></script>
</head>

<body class="bg-slate-50 font-sans min-h-screen">

    <!-- TELA DE LOGIN -->
    <section id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <form onsubmit="loginGerente(event)" class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md space-y-4">
            <h1 class="text-2xl font-extrabold text-purple-700 text-center">Bibliotech • Gerente</h1>
            <input id="loginEmail" type="email" required placeholder="E-mail" class="w-full border p-3 rounded-xl">
            <input id="loginSenha" type="password" required placeholder="Senha" class="w-full border p-3 rounded-xl">
            <button
                class="w-full bg-purple-700 text-white font-bold py-3 rounded-xl hover:bg-purple-800">Entrar</button>
            <p id="loginErro" class="text-red-600 text-sm text-center hidden"></p>
        </form>
    </section>

    <!-- PAINEL -->
    <section id="painel" class="hidden p-6 max-w-6xl mx-auto space-y-8">
        <header class="flex justify-between items-center bg-white p-4 rounded-2xl shadow">
            <div>
                <h2 id="bibNome" class="font-bold text-lg text-slate-800"></h2>
                <p id="bibGerente" class="text-xs text-slate-500"></p>
            </div>
            <button onclick="logoutGerente()"
                class="text-sm bg-red-100 text-red-700 px-4 py-2 rounded-xl font-semibold">Sair</button>
        </header>

        <!-- CADASTRO LIVRO -->
        <form id="formLivro" onsubmit="cadastrarLivro(event)" class="bg-white p-6 rounded-3xl shadow space-y-3">
            <h3 class="font-bold text-purple-700">➕ Cadastrar Livro</h3>
            <input id="livroTitulo" required placeholder="Título" class="w-full border p-2 rounded-xl">
            <input id="livroAutor" required placeholder="Autor" class="w-full border p-2 rounded-xl">
            <input id="livroCategoria" required placeholder="Categoria" class="w-full border p-2 rounded-xl">
            <input id="livroQtd" type="number" min="1" required placeholder="Quantidade"
                class="w-full border p-2 rounded-xl">
            <textarea id="livroSinopse" required placeholder="Sinopse" class="w-full border p-2 rounded-xl"
                rows="3"></textarea>
            <input id="livroFotoFile" type="file" accept="image/*" class="w-full text-sm">
            <button
                class="bg-purple-700 text-white px-6 py-2 rounded-xl font-bold hover:bg-purple-800">Cadastrar</button>
        </form>

        <!-- NOVO EMPRÉSTIMO -->
        <form id="empFormEmprestimo" onsubmit="registrarEmprestimo(event)"
            class="bg-white p-6 rounded-3xl shadow space-y-3">
            <h3 class="font-bold text-blue-700">📖 Novo Empréstimo</h3>
            <select id="empLivroId" required class="w-full border p-2 rounded-xl">
                <option value="">Selecione o livro...</option>
            </select>
            <input id="empNome" required placeholder="Nome do leitor" class="w-full border p-2 rounded-xl">
            <input id="empCpf" required placeholder="CPF" class="w-full border p-2 rounded-xl">
            <input id="empEndereco" required placeholder="Endereço" class="w-full border p-2 rounded-xl">
            <button class="bg-blue-700 text-white px-6 py-2 rounded-xl font-bold hover:bg-blue-800">Registrar</button>
        </form>

        <!-- LISTAS -->
        <div class="bg-white p-6 rounded-3xl shadow">
            <h3 class="font-bold text-slate-700 mb-3">📚 Meus Livros</h3>
            <div id="listaMeusLivros" class="space-y-2 text-sm"></div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow">
            <h3 class="font-bold text-slate-700 mb-3">📄 Empréstimos Ativos</h3>
            <div id="listaEmprestimos" class="space-y-2 text-sm"></div>
        </div>
    </section>

    <script>
        let gerenteAtual = null;

        const mapLivro = (l) => ({
            id: l.codigo_livro,
            bibliotecaNome: l.biblioteca_nome,
            titulo: l.titulo,
            autor: l.autor,
            categoria: l.categoria,
            foto: l.foto,
            quantidadeTotal: Number(l.quantidade_total),
            sinopse: l.sinopse
        });

        const mapEmprestimo = (e) => ({
            id: e.codigo_emp,
            livroId: e.livro_id,
            livroTitulo: e.livro_titulo,
            nome: e.nome_leitor,
            cpf: e.cpf_leitor,
            endereco: e.endereco_leitor,
            data: e.data_emp,
            status: e.status
        });

        // ---------- AUTENTICAÇÃO ----------
        async function loginGerente(ev) {
            ev.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;
            const erroEl = document.getElementById('loginErro');
            erroEl.classList.add('hidden');

            const { data: authData, error: authErr } = await sb.auth.signInWithPassword({ email, password: senha });
            if (authErr) {
                erroEl.textContent = 'Credenciais inválidas.';
                erroEl.classList.remove('hidden');
                return;
            }

            // Busca perfil do gerente vinculado
            const { data: gRows, error: gErr } = await sb
                .from('gerentes')
                .select('*')
                .eq('email', email)
                .limit(1);

            if (gErr || !gRows || gRows.length === 0) {
                erroEl.textContent = 'Gerente não encontrado.';
                erroEl.classList.remove('hidden');
                await sb.auth.signOut();
                return;
            }

            const g = gRows[0];

            // Vincula auth_user_id se ainda não estiver vinculado
            if (!g.auth_user_id) {
                await sb.from('gerentes').update({ auth_user_id: authData.user.id }).eq('codigo_mgr', g.codigo_mgr);
            }

            gerenteAtual = {
                id: g.codigo_mgr,
                biblioteca: g.biblioteca,
                gerente: g.gerente,
                email: g.email
            };

            mostrarPainel();
        }

        async function logoutGerente() {
            await sb.auth.signOut();
            gerenteAtual = null;
            document.getElementById('painel').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        function mostrarPainel() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('painel').classList.remove('hidden');
            document.getElementById('bibNome').textContent = gerenteAtual.biblioteca;
            document.getElementById('bibGerente').textContent = `Gerente: ${gerenteAtual.gerente}`;
            atualizarInterfaceGerente();
        }

        // ---------- DADOS ----------
        async function carregarDadosDoBanco() {
            try {
                const [livrosRes, empRes] = await Promise.all([
                    sb.from('livros').select('*').eq('biblioteca_nome', gerenteAtual.biblioteca),
                    sb.from('emprestimos').select('*').eq('status', 'Ativo')
                ]);
                if (livrosRes.error) throw livrosRes.error;
                if (empRes.error) throw empRes.error;
                return {
                    livros: (livrosRes.data || []).map(mapLivro),
                    emprestimos: (empRes.data || []).map(mapEmprestimo)
                };
            } catch (err) {
                console.error('[gerente] erro:', err);
                return { livros: [], emprestimos: [] };
            }
        }

        // ---------- CADASTRO DE LIVRO ----------
        async function cadastrarLivro(ev) {
            ev.preventDefault();
            const file = document.getElementById('livroFotoFile').files[0];
            if (!file) { alert('Selecione uma foto de capa.'); return; }

            // Upload no Storage (bucket "capas")
            const ext = file.name.split('.').pop();
            const path = `${gerenteAtual.id}/${Date.now()}.${ext}`;
            const { error: upErr } = await sb.storage.from('capas').upload(path, file, { upsert: false });
            if (upErr) { alert('Erro upload: ' + upErr.message); return; }

            const { data: pub } = sb.storage.from('capas').getPublicUrl(path);
            const novoId = 'LIV-' + Date.now().toString(36).toUpperCase();

            const { error } = await sb.from('livros').insert([{
                codigo_livro: novoId,
                biblioteca_nome: gerenteAtual.biblioteca,
                titulo: document.getElementById('livroTitulo').value,
                autor: document.getElementById('livroAutor').value,
                categoria: document.getElementById('livroCategoria').value,
                foto: pub.publicUrl,
                quantidade_total: Number(document.getElementById('livroQtd').value),
                sinopse: document.getElementById('livroSinopse').value
            }]);

            if (error) { alert('Erro ao cadastrar: ' + error.message); return; }

            document.getElementById('formLivro').reset();
            atualizarInterfaceGerente();
        }

        // ---------- EMPRÉSTIMO ----------
        async function registrarEmprestimo(ev) {
            ev.preventDefault();
            const idLivro = document.getElementById('empLivroId').value;
            const db = await carregarDadosDoBanco();
            const livro = db.livros.find(l => l.id === idLivro);
            if (!livro) { alert('Livro não encontrado.'); return; }

            const { data: empsAtivos } = await sb.from('emprestimos')
                .select('codigo_emp').eq('livro_id', idLivro).eq('status', 'Ativo');
            const usados = empsAtivos?.length || 0;
            if (usados >= livro.quantidadeTotal) { alert('Sem exemplares disponíveis.'); return; }

            const novoEmpId = 'EMP-' + Date.now().toString(36).toUpperCase();
            const { error } = await sb.from('emprestimos').insert([{
                codigo_emp: novoEmpId,
                livro_id: idLivro,
                livro_titulo: livro.titulo,
                nome_leitor: document.getElementById('empNome').value,
                cpf_leitor: document.getElementById('empCpf').value,
                endereco_leitor: document.getElementById('empEndereco').value,
                data_emp: new Date().toLocaleDateString('pt-BR'),
                status: 'Ativo'
            }]);

            if (error) { alert('Erro: ' + error.message); return; }
            document.getElementById('empFormEmprestimo').reset();
            atualizarInterfaceGerente();
        }

        async function darBaixaEmprestimo(empId) {
            const { error } = await sb.from('emprestimos').update({ status: 'Devolvido' }).eq('codigo_emp', empId);
            if (error) { alert(error.message); return; }
            atualizarInterfaceGerente();
        }

        async function excluirLivro(id) {
            if (!confirm('Excluir livro? Empréstimos vinculados também serão removidos.')) return;
            const { error } = await sb.from('livros').delete().eq('codigo_livro', id);
            if (error) { alert(error.message); return; }
            atualizarInterfaceGerente();
        }

        // ---------- INTERFACE ----------
        async function atualizarInterfaceGerente() {
            if (!gerenteAtual) return;
            const db = await carregarDadosDoBanco();

            // Select de livros
            const sel = document.getElementById('empLivroId');
            sel.innerHTML = '<option value="">Selecione o livro...</option>' +
                db.livros.map(l => `<option value="${l.id}">${l.titulo} — ${l.autor}</option>`).join('');

            // Lista de livros
            document.getElementById('listaMeusLivros').innerHTML = db.livros.length
                ? db.livros.map(l => `
            <div class="flex justify-between items-center border-b py-2">
              <div><b>${l.titulo}</b> — ${l.autor} <span class="text-xs text-slate-400">(${l.quantidadeTotal} ex.)</span></div>
              <button onclick="excluirLivro('${l.id}')" class="text-red-600 text-xs font-bold">Excluir</button>
            </div>`).join('')
                : '<p class="text-slate-400">Nenhum livro cadastrado.</p>';

            // Lista de empréstimos ativos (filtra pelos livros da biblioteca)
            const idsBiblioteca = new Set(db.livros.map(l => l.id));
            const ativos = db.emprestimos.filter(e => idsBiblioteca.has(e.livroId));
            document.getElementById('listaEmprestimos').innerHTML = ativos.length
                ? ativos.map(e => `
            <div class="flex justify-between items-center border-b py-2">
              <div><b>${e.livroTitulo}</b> → ${e.nome} (${e.cpf}) em ${e.data}</div>
              <button onclick="darBaixaEmprestimo('${e.id}')" class="bg-green-600 text-white text-xs px-3 py-1 rounded-lg">Devolver</button>
            </div>`).join('')
                : '<p class="text-slate-400">Nenhum empréstimo ativo.</p>';
        }

        // ---------- BOOTSTRAP ----------
        window.addEventListener('load', async () => {
            // Se já houver sessão ativa, refaz login automático
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                const email = session.user.email;
                const { data: gRows } = await sb.from('gerentes').select('*').eq('email', email).limit(1);
                if (gRows && gRows[0]) {
                    gerenteAtual = {
                        id: gRows[0].codigo_mgr,
                        biblioteca: gRows[0].biblioteca,
                        gerente: gRows[0].gerente,
                        email
                    };
                    mostrarPainel();
                }
            }
        });
    </script>
</body>

</html>
