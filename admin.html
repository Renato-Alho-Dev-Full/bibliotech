<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Keven Admin Master - SaaS Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
</head>

<body class="bg-slate-50 font-sans min-h-screen p-6 space-y-6">

    <section id="loginAdmin" class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-xl space-y-3">
        <h1 class="text-2xl font-extrabold text-purple-700 text-center">Admin Master</h1>
        <input id="adminEmail" type="email" placeholder="E-mail" class="w-full border p-3 rounded-xl">
        <input id="adminSenha" type="password" placeholder="Senha" class="w-full border p-3 rounded-xl">
        <button onclick="loginAdmin()" class="w-full bg-purple-700 text-white py-3 rounded-xl font-bold">Entrar</button>
        <p id="adminErro" class="text-red-600 text-sm text-center hidden"></p>
    </section>

    <section id="adminPainel" class="hidden max-w-6xl mx-auto space-y-6">
        <header class="flex justify-between items-center bg-white p-4 rounded-2xl shadow">
            <h2 class="font-bold text-lg text-purple-700">Painel Master</h2>
            <button onclick="sb.auth.signOut().then(()=>location.reload())"
                class="text-red-600 text-sm font-bold">Sair</button>
        </header>

        <form onsubmit="criarGerente(event)" class="bg-white p-6 rounded-3xl shadow space-y-2">
            <h3 class="font-bold text-purple-700">➕ Novo Gerente</h3>
            <input id="cadBibNome" required placeholder="Nome da biblioteca" class="w-full border p-2 rounded-xl">
            <input id="cadGerenteNome" required placeholder="Nome do gerente" class="w-full border p-2 rounded-xl">
            <input id="cadEmail" required type="email" placeholder="E-mail" class="w-full border p-2 rounded-xl">
            <input id="cadUserLogin" required placeholder="Usuário (login)" class="w-full border p-2 rounded-xl">
            <input id="cadUserSenha" required type="password" placeholder="Senha" class="w-full border p-2 rounded-xl">
            <button class="bg-purple-700 text-white px-6 py-2 rounded-xl font-bold">Cadastrar</button>
        </form>

        <form onsubmit="realizarVendaPDV(event)" class="bg-white p-6 rounded-3xl shadow space-y-2">
            <h3 class="font-bold text-green-700">💳 Venda PDV</h3>
            <select id="pdvGerenteId" required class="w-full border p-2 rounded-xl"></select>
            <select id="pdvMeses" required class="w-full border p-2 rounded-xl">
                <option value="1">1 mês — R$ 97</option>
                <option value="4">4 meses — R$ 350</option>
                <option value="6">6 meses — R$ 500</option>
                <option value="12">12 meses — R$ 900</option>
            </select>
            <select id="pdvStatusPgto" class="w-full border p-2 rounded-xl">
                <option value="Pago">Pago</option>
                <option value="Pendente">Pendente</option>
            </select>
            <button class="bg-green-700 text-white px-6 py-2 rounded-xl font-bold">Registrar venda</button>
        </form>

        <div class="bg-white p-6 rounded-3xl shadow">
            <h3 class="font-bold mb-3">👥 Gerentes</h3>
            <div id="listaGerentes" class="text-sm space-y-2"></div>
        </div>
    </section>

    <script>
        async function callAdmin(action, payload = {}) {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) throw new Error('Não autenticado');
            const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-ops`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${session.access_token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ action, payload })
            });
            const json = await res.json();
            if (!res.ok) throw new Error(json.error || 'erro');
            return json;
        }

        async function loginAdmin() {
            const email = document.getElementById('adminEmail').value;
            const senha = document.getElementById('adminSenha').value;
            const err = document.getElementById('adminErro');
            err.classList.add('hidden');

            const { error } = await sb.auth.signInWithPassword({ email, password: senha });
            if (error) { err.textContent = error.message; err.classList.remove('hidden'); return; }

            const { data: { user } } = await sb.auth.getUser();
            if (user.app_metadata?.role !== 'admin') {
                err.textContent = 'Usuário não é admin.';
                err.classList.remove('hidden');
                await sb.auth.signOut();
                return;
            }

            document.getElementById('loginAdmin').classList.add('hidden');
            document.getElementById('adminPainel').classList.remove('hidden');
            carregarPainel();
        }

        async function carregarPainel() {
            const { gerentes } = await callAdmin('listar');
            document.getElementById('pdvGerenteId').innerHTML =
                gerentes.map(g => `<option value="${g.codigo_mgr}">${g.biblioteca} — ${g.gerente}</option>`).join('');
            document.getElementById('listaGerentes').innerHTML = gerentes.map(g => `
        <div class="flex justify-between border-b py-2">
          <div><b>${g.biblioteca}</b> — ${g.gerente} (${g.email})
            <span class="text-xs text-slate-500">Validade: ${g.validade} | ${g.pagamento}</span></div>
          <button onclick="excluirGerente('${g.codigo_mgr}')" class="text-red-600 text-xs font-bold">Excluir</button>
        </div>`).join('');
        }

        async function criarGerente(ev) {
            ev.preventDefault();
            try {
                await callAdmin('criar_gerente', {
                    biblioteca: document.getElementById('cadBibNome').value,
                    gerente: document.getElementById('cadGerenteNome').value,
                    email: document.getElementById('cadEmail').value,
                    usuario: document.getElementById('cadUserLogin').value,
                    senha: document.getElementById('cadUserSenha').value
                });
                ev.target.reset();
                carregarPainel();
            } catch (e) { alert(e.message); }
        }

        async function realizarVendaPDV(ev) {
            ev.preventDefault();
            try {
                await callAdmin('venda', {
                    gerenteId: document.getElementById('pdvGerenteId').value,
                    meses: Number(document.getElementById('pdvMeses').value),
                    statusPgto: document.getElementById('pdvStatusPgto').value
                });
                carregarPainel();
            } catch (e) { alert(e.message); }
        }

        async function excluirGerente(id) {
            if (!confirm('Revogar acesso e excluir gerente?')) return;
            try { await callAdmin('excluir_gerente', { gerenteId: id }); carregarPainel(); }
            catch (e) { alert(e.message); }
        }
    </script>
</body>

</html>
