<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante Virtual • Bibliotech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6b21a8">

    <!-- Importação do SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = ' https://gwdpnesdtifwvcbxbkko.supabase.co ';
        const SUPABASE_ANON_KEY = ' sb_publishable_GtiWd4H_VxZXZwbXEBHuow_YOxFuF_N ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Exemplo de função para buscar livros do Supabase na Estante do Leitor:
        async function carregarLivrosDoSupabase() {
            const { data, error } = await supabaseClient.from('livros').select('*');
            if (error) {
                console.error('Erro ao buscar livros:', error);
                return [];
            }
            return data;
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- HERO HEADER COM PARALLAX -->
    <header class="parallax-user text-white py-12 px-6 shadow-xl relative">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="space-y-2 text-center md:text-left">
                <div
                    class="inline-flex items-center gap-2 bg-purple-500/30 border border-purple-300/30 px-3 py-1 rounded-full text-xs font-semibold text-purple-200">
                    <i data-lucide="book-open" class="w-4 h-4"></i> Acervo Público Acadêmico
                </div>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">Seja bem vindo a Bibliotech</h1>
                <p class="text-purple-200 text-sm max-w-xl">Navegue pelas categorias, consulte a disponibilidade em
                    tempo
                    real e verifique detalhes completos de cada livro.</p>
            </div>
            <!-- Barra de Busca Moderna -->
            <div class="relative w-full md:w-80">
                <input type="text" id="searchInput" oninput="filtrarLivros()" placeholder="Buscar título ou autor..."
                    class="w-full pl-11 pr-4 py-3 bg-white/10 backdrop-blur-md border border-white/20 text-white placeholder-purple-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-white">
                <i data-lucide="search" class="w-5 h-5 text-purple-200 absolute left-3.5 top-3.5"></i>
            </div>
        </div>
    </header>

    <!-- MENU RESPONSIVO DE CATEGORIAS -->
    <nav class="bg-white border-b shadow-sm py-4 px-6 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto flex items-center overflow-x-auto gap-3 no-scrollbar" id="categoryContainer">
            <!-- Categorias geradas via JS -->
        </div>
    </nav>

    <!-- GRID DE CARDS DE LIVROS -->
    <main class="max-w-7xl mx-auto p-6 flex-1 w-full">
        <div id="booksGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <!-- Cards injetados via JS -->
        </div>
    </main>

    <!-- MODAL DE DETALHES -->
    <div id="modalDetalhes"
        class="fixed inset-0 bg-black/60 hidden backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div
            class="bg-white rounded-3xl max-w-lg w-full p-6 relative shadow-2xl animate-in fade-in zoom-in duration-200">
            <button onclick="fecharModal()"
                class="absolute top-4 right-4 bg-gray-100 hover:bg-gray-200 p-2 rounded-full text-gray-600 transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- RODAPÉ -->
    <footer class="bg-slate-900 text-gray-400 py-6 text-center text-xs mt-12">
        <p>Sistema Integrado de Biblioteca © 2026 - Acesso Livre ao Leitor</p>
    </footer>

    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuração do Cliente Supabase (Insira suas chaves reais)

        let categoriaAtiva = 'Todos';
        let cacheGlobal = { livros: [], emprestimos: [] };

        // Função assíncrona para buscar dados do Supabase
        async function obterDadosDoSupabase() {
            try {
                const { data: livros, error: errLivros } = await supabaseClient.from('livros').select('*');
                const { data: emprestimos, error: errEmp } = await supabaseClient.from('emprestimos').select('*');

                if (errLivros || errEmp) {
                    console.error('Erro ao buscar dados do Supabase:', errLivros || errEmp);
                    return { livros: [], emprestimos: [] };
                }

                return {
                    livros: livros.map(l => ({
                        id: l.codigo_livro,
                        bibliotecaNome: l.biblioteca_nome,
                        titulo: l.titulo,
                        autor: l.autor,
                        categoria: l.categoria,
                        foto: l.foto,
                        quantidadeTotal: l.quantidade_total,
                        sinopse: l.sinopse
                    })),
                    emprestimos: emprestimos.map(e => ({
                        id: e.codigo_emp,
                        livroId: e.livro_id,
                        livroTitulo: e.livro_titulo,
                        nome: e.nome_leitor,
                        cpf: e.cpf_leitor,
                        endereco: e.endereco_leitor,
                        data: e.data_emp,
                        status: e.status
                    }))
                };
            } catch (e) {
                console.error('Erro de conexão:', e);
                return { livros: [], emprestimos: [] };
            }
        }

        async function renderCategorias() {
            cacheGlobal = await obterDadosDoSupabase();
            const cats = ['Todos', ...new Set(cacheGlobal.livros.map(l => l.categoria))];
            document.getElementById('categoryContainer').innerHTML = cats.map(c => `
                <button onclick="filtrarCategoria('${c}')" class="px-5 py-2.5 rounded-2xl text-xs font-bold transition whitespace-nowrap shadow-sm ${categoriaAtiva === c ? 'bg-purple-700 text-white shadow-purple-200' : 'bg-[#F1EFEA] text-slate-700 hover:bg-purple-100'}">
                    ${c}
                </button>
            `).join('');
        }

        function filtrarCategoria(cat) {
            categoriaAtiva = cat;
            renderCategorias();
            filtrarLivros();
        }

        async function filtrarLivros() {
            if (cacheGlobal.livros.length === 0) {
                cacheGlobal = await obterDadosDoSupabase();
            }

            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = cacheGlobal.livros.filter(l => {
                const matchCat = categoriaAtiva === 'Todos' || l.categoria === categoriaAtiva;
                const matchSearch = l.titulo.toLowerCase().includes(term) || l.autor.toLowerCase().includes(term);
                return matchCat && matchSearch;
            });
            renderLivros(filtrados, cacheGlobal.emprestimos);
        }

        function renderLivros(lista, emprestimos) {
            const grid = document.getElementById('booksGrid');
            if (lista.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-gray-400 font-medium">Nenhum livro encontrado nesta categoria.</div>`;
                return;
            }

            grid.innerHTML = lista.map(l => {
                const empAtivos = emprestimos.filter(e => e.livroId === l.id && e.status === 'Ativo').length;
                const disponivel = (l.quantidadeTotal - empAtivos) > 0;

                return `
                    <div class="bg-white rounded-3xl shadow-md hover:shadow-2xl transition-all duration-300 flex flex-col overflow-hidden border border-purple-100 group">
                        <div class="relative h-60 overflow-hidden bg-gray-100">
                            <img src="${l.foto}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            <div class="absolute top-3 left-3">
                                <span class="px-3 py-1 text-[11px] font-bold rounded-full shadow-md ${disponivel ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}">
                                    ${disponivel ? 'Disponível' : 'Emprestado'}
                                </span>
                            </div>
                        </div>
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <span class="text-[10px] font-extrabold text-purple-600 uppercase tracking-widest">${l.categoria}</span>
                                <h3 class="font-bold text-slate-900 text-lg line-clamp-1 mt-1">${l.titulo}</h3>
                                <p class="text-xs text-slate-500 mb-4">${l.autor}</p>
                            </div>
                            <button onclick="abrirModal('${l.id}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-2xl transition flex items-center justify-center gap-2 shadow-md shadow-blue-200 text-xs">
                                <i data-lucide="info" class="w-4 h-4"></i> Detalhes
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        async function abrirModal(id) {
            if (cacheGlobal.livros.length === 0) {
                cacheGlobal = await obterDadosDoSupabase();
            }

            const l = cacheGlobal.livros.find(x => x.id === id);
            if (!l) return;

            const empAtivos = cacheGlobal.emprestimos.filter(e => e.livroId === l.id && e.status === 'Ativo').length;
            const disponivel = (l.quantidadeTotal - empAtivos) > 0;

            document.getElementById('modalContent').innerHTML = `
                <div class="relative h-56 rounded-2xl overflow-hidden mb-4 shadow-inner">
                    <img src="${l.foto}" class="w-full h-full object-cover">
                </div>
                <span class="inline-block px-3 py-1 text-xs font-bold rounded-full mb-3 ${disponivel ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                    ${disponivel ? 'Disponível para Empréstimo' : 'Todos os exemplares emprestados'}
                </span>
                <h2 class="text-2xl font-bold text-slate-900">${l.titulo}</h2>
                <p class="text-xs font-semibold text-purple-600 mb-3">Autor: ${l.autor} | Categoria: ${l.categoria}</p>
                <p class="text-slate-600 text-sm mb-4 leading-relaxed">${l.sinopse}</p>
                <div class="text-[11px] text-slate-400 bg-slate-50 p-3 rounded-xl border">Código ID: ${l.id} | Total no acervo: ${l.quantidadeTotal}</div>
            `;
            document.getElementById('modalDetalhes').classList.remove('hidden');
            lucide.createIcons();
        }

        function fecharModal() {
            document.getElementById('modalDetalhes').classList.add('hidden');
        }

        // Inicialização da página
        renderCategorias().then(() => {
            filtrarLivros();
        });
    </script>
</body>

</html>
