<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante Virtual - Bibliotech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.436.0/dist/umd/lucide.min.js"></script>
    <script src="config.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .parallax-user {
            background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

    <header class="parallax-user text-white py-12 px-6 shadow-xl">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="space-y-2 text-center md:text-left">
                <div
                    class="inline-flex items-center gap-2 bg-purple-500/30 border border-purple-300 px-3 py-1 rounded-full text-xs font-semibold text-purple-200">
                    <i data-lucide="book-open" class="w-4 h-4"></i> Acervo Público Acadêmico
                </div>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">Bem-vindo à Bibliotech</h1>
                <p class="text-purple-200 text-sm max-w-xl">Navegue pelas categorias e verifique a disponibilidade em
                    tempo real.</p>
            </div>
            <div class="relative w-full md:w-80">
                <input type="text" id="searchInput" oninput="filtrarLivros()" placeholder="Buscar título ou autor..."
                    class="w-full pl-11 pr-4 py-3 bg-white/10 backdrop-blur-md border border-white/20 text-white placeholder-purple-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-white">
                <i data-lucide="search" class="w-5 h-5 text-purple-200 absolute left-3 top-3.5"></i>
            </div>
        </div>
    </header>

    <nav class="bg-white border-b shadow-sm py-4 px-6 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto flex items-center overflow-x-auto gap-3 no-scrollbar" id="categoryContainer">
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 flex-1 w-full">
        <div id="booksGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
    </main>

    <div id="modalDetalhes"
        class="fixed inset-0 bg-black/60 hidden backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 relative shadow-2xl">
            <button onclick="fecharModal()"
                class="absolute top-4 right-4 bg-gray-100 hover:bg-gray-200 p-2 rounded-full text-gray-600 transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        let categoriaAtiva = 'Todos';
        let cacheGlobal = { livros: [], emprestimos: [] };
        let carregando = false;

        // --- Mapeadores (correção: retorno com chaves {}) ---
        const mapLivro = (l) => ({
            id: l.codigo_livro,
            bibliotecaNome: l.biblioteca_nome,
            titulo: l.titulo,
            autor: l.autor,
            categoria: l.categoria,
            foto: l.foto,
            quantidadeTotal: Number(l.quantidade_total),
            sinopse: l.sinopse
        });

        const mapEmprestimo = (e) => ({
            id: e.codigo_emp,
            livroId: e.livro_id,
            livroTitulo: e.livro_titulo,
            nome: e.nome_leitor,
            status: e.status
        });

        async function obterDadosDoSupabase() {
            try {
                const [livrosRes, empRes] = await Promise.all([
                    sb.from('livros').select('*'),
                    sb.from('emprestimos').select('*').eq('status', 'Ativo')
                ]);
                if (livrosRes.error) throw livrosRes.error;
                if (empRes.error) throw empRes.error;
                return {
                    livros: (livrosRes.data || []).map(mapLivro),
                    emprestimos: (empRes.data || []).map(mapEmprestimo)
                };
            } catch (err) {
                console.error('[leitor] erro ao carregar:', err);
                return { livros: [], emprestimos: [] };
            }
        }

        async function inicializarLeitor() {
            if (carregando) return;
            carregando = true;
            cacheGlobal = await obterDadosDoSupabase();
            renderCategorias();
            filtrarLivros();
            carregando = false;
        }

        function renderCategorias() {
            const cats = ['Todos', ...new Set(cacheGlobal.livros.map(l => l.categoria).filter(Boolean))];
            document.getElementById('categoryContainer').innerHTML = cats.map(c => `
        <button onclick="filtrarCategoria('${c.replace(/'/g, "\\'")}')"
          class="px-5 py-2.5 rounded-2xl text-xs font-bold transition whitespace-nowrap shadow-sm
          ${categoriaAtiva === c
                    ? 'bg-purple-700 text-white shadow-purple-200'
                    : 'bg-[#1FEFEA] text-slate-700 hover:bg-purple-100'}">
          ${c}
        </button>
      `).join('');
        }

        function filtrarCategoria(cat) {
            categoriaAtiva = cat;
            renderCategorias();
            filtrarLivros();
        }

        function filtrarLivros() {
            const term = (document.getElementById('searchInput')?.value || '').toLowerCase();
            const filtrados = cacheGlobal.livros.filter(l => {
                const matchCat = categoriaAtiva === 'Todos' || l.categoria === categoriaAtiva;
                const matchTerm =
                    (l.titulo || '').toLowerCase().includes(term) ||
                    (l.autor || '').toLowerCase().includes(term);
                return matchCat && matchTerm;
            });
            renderLivros(filtrados, cacheGlobal.emprestimos);
        }

        function calcularDisponibilidade(livroId, quantidadeTotal, emprestimos) {
            const ativos = emprestimos.filter(e => e.livroId === livroId && e.status === 'Ativo').length;
            return { ativos, disponivel: (quantidadeTotal - ativos) > 0 };
        }

        function renderLivros(lista, emprestimos) {
            const grid = document.getElementById('booksGrid');
            if (lista.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-gray-400 font-medium">Nenhum livro encontrado.</div>`;
                return;
            }
            grid.innerHTML = lista.map(l => {
                const { disponivel } = calcularDisponibilidade(l.id, l.quantidadeTotal, emprestimos);
                return `
          <div class="bg-white rounded-3xl shadow-md hover:shadow-2xl transition-all duration-300 flex flex-col overflow-hidden border border-purple-100 group relative">
            <div class="relative h-60 overflow-hidden bg-gray-100">
              <img src="${l.foto || ''}" alt="${l.titulo}"
                   class="w-full h-full object-cover group-hover:scale-105 transition duration-500"
                   onerror="this.src='https://placehold.co/300x400?text=Sem+Capa'">
              <span class="absolute top-3 left-3 px-3 py-1 text-[11px] font-bold rounded-full shadow-md
                ${disponivel ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}">
                ${disponivel ? 'Disponível' : 'Emprestado'}
              </span>
            </div>
            <div class="p-5 flex flex-col justify-between flex-1">
              <div>
                <span class="text-[10px] font-extrabold text-purple-600 uppercase tracking-widest">${l.categoria}</span>
                <h3 class="font-bold text-slate-900 text-lg line-clamp-1 mt-1">${l.titulo}</h3>
                <p class="text-xs text-slate-500 mb-4">${l.autor}</p>
              </div>
              <button onclick="abrirModal('${l.id}')"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-2xl transition flex items-center justify-center gap-2 shadow-md text-xs">
                <i data-lucide="info" class="w-4 h-4"></i> Detalhes
              </button>
            </div>
          </div>
        `;
            }).join('');
            lucide.createIcons();
        }

        // ✅ VERSÃO ÚNICA E CORRETA (as 20 duplicatas removidas)
        function abrirModal(id) {
            const l = cacheGlobal.livros.find(x => x.id === id);
            if (!l) return;
            const { disponivel, ativos } = calcularDisponibilidade(l.id, l.quantidadeTotal, cacheGlobal.emprestimos);
            document.getElementById('modalContent').innerHTML = `
        <div class="relative h-56 rounded-2xl overflow-hidden mb-4 shadow-inner">
          <img src="${l.foto || ''}" alt="${l.titulo}" class="w-full h-full object-cover"
               onerror="this.src='https://placehold.co/400x300?text=Sem+Capa'">
        </div>
        <span class="inline-block px-3 py-1 text-xs font-bold rounded-full mb-3
          ${disponivel ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
          ${disponivel ? 'Disponível para Empréstimo' : 'Todos exemplares emprestados'}
        </span>
        <h2 class="text-2xl font-bold text-slate-900">${l.titulo}</h2>
        <p class="text-xs font-semibold text-purple-600 mb-3">Autor: ${l.autor} | Categoria: ${l.categoria}</p>
        <p class="text-slate-600 text-sm mb-4 leading-relaxed">${l.sinopse || '—'}</p>
        <div class="text-[11px] text-slate-400 bg-slate-50 p-3 rounded-xl border">
          ID: ${l.id} | Total: ${l.quantidadeTotal} | Emprestados: ${ativos}
        </div>
      `;
            document.getElementById('modalDetalhes').classList.remove('hidden');
            lucide.createIcons();
        }

        function fecharModal() {
            document.getElementById('modalDetalhes').classList.add('hidden');
        }

        // Bootstrap: espera Supabase + DOM
        window.addEventListener('load', () => {
            if (window.sb) inicializarLeitor();
            else window.addEventListener('supabase:ready', inicializarLeitor, { once: true });
        });
    </script>
</body>

</html>
